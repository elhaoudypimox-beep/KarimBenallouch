<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F1015"><title>Karim Benallouch | Barrages</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.0/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.0/firebase-auth-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.0/firebase-firestore-compat.min.js"></script>
<style>
:root{--bg:#0F1015;--card:#15161C;--card2:#1B1C25;--line:rgba(212,175,55,.16);--tx:#EDEAE2;--mut:#9A9AA8;--ac:#D4AF37;--gold:#D4AF37;--ok:#34d399;--bad:#f87171;--gg:linear-gradient(135deg,#F3D77A 0%,#D4AF37 45%,#B8860B 100%)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg)}
html{height:100%}
body{font-family:Inter,system-ui,sans-serif;color:var(--tx);min-height:100%;overscroll-behavior:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(env(safe-area-inset-bottom) + 94px) env(safe-area-inset-left);background:radial-gradient(500px 500px at 0% 0%,rgba(212,175,55,.07),transparent),radial-gradient(500px 500px at 100% 100%,rgba(243,156,18,.06),transparent),var(--bg)}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:rgba(212,175,55,.25);border-radius:8px}
#app{max-width:780px;min-height:calc(var(--vh,1vh)*100 - 94px);margin:0 auto;padding:14px;animation:fi .4s ease both}@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.box{max-width:430px;margin:5vh auto 0;text-align:center}
.box>img{width:80px;height:80px;border-radius:18px;object-fit:cover;border:1px solid var(--line);box-shadow:0 0 0 1px rgba(212,175,55,.35),0 8px 30px -8px rgba(212,175,55,.25)}
.pn{background:linear-gradient(180deg,rgba(27,28,37,.9),rgba(21,22,28,.95));border:1px solid var(--line);border-radius:18px;padding:22px;margin-top:22px;text-align:left}
h1{font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:700;margin:14px 0 4px;letter-spacing:.02em}h1 span,.gt{background:var(--gg);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.25em;margin:0}
.m{color:var(--mut);font-size:14px;margin:4px 0}label{display:block;font-size:12px;font-weight:600;color:var(--mut);margin:10px 0 2px}
input,textarea,select{width:100%;margin:4px 0;padding:11px 12px;background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:10px;font:inherit;color-scheme:dark}
input:focus,textarea:focus,select:focus{outline:0;border-color:rgba(212,175,55,.6)}input::placeholder,textarea::placeholder{color:#6B6B78}
button{background:var(--gg);color:#0F1015;border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer;margin:8px 6px 0 0;transition:transform .1s}button:active{transform:scale(.97)}
button.s{background:transparent;color:var(--mut);border:1px solid var(--line)}button.g{background:var(--gg)}button.r{color:var(--bad);border-color:rgba(248,113,113,.4)}
.wide{width:100%;margin:12px 0 0}.sw{display:flex;gap:22px;border-bottom:1px solid rgba(255,255,255,.06);margin-bottom:8px}.sw a{padding:0 0 10px;font-weight:600;color:var(--mut);border-bottom:2px solid transparent;margin-bottom:-1px}.sw a.on{color:var(--gold);border-color:var(--gold)}
a{cursor:pointer;font-size:14px;color:var(--gold)}.bad{color:var(--bad);font-size:13px}
.hd{display:flex;align-items:center;gap:10px;padding:6px 0 14px}.hd img{width:42px;height:42px;border-radius:10px;border:1px solid var(--line)}.hd b{flex:1;font-family:'Cormorant Garamond',serif;font-size:20px}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{flex:1;margin:0;background:var(--card);color:var(--mut);border:1px solid var(--line)}.tabs button.on{background:var(--gg);color:#0F1015;border-color:transparent}
@media(max-width:700px){.tabs{position:fixed;left:0;right:0;bottom:0;margin:0;padding:8px 10px calc(env(safe-area-inset-bottom) + 8px);background:rgba(15,16,21,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);z-index:5}}
.c{background:linear-gradient(180deg,rgba(27,28,37,.9),rgba(21,22,28,.95));border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0;transition:.25s}.c:hover{border-color:rgba(212,175,55,.35);transform:translateY(-2px)}
.c b{font-size:15px}.tag{font-size:11px;background:rgba(212,175,55,.12);border-radius:20px;padding:2px 9px;color:var(--gold);margin-left:6px}
.pill{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:20px;padding:3px 10px;margin:4px 4px 0 0;color:var(--mut)}.pill.ok{color:var(--ok);border-color:rgba(52,211,153,.5)}
.bar{height:6px;background:var(--card2);border-radius:6px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gg)}
.toast{position:fixed;top:calc(env(safe-area-inset-top) + 12px);left:50%;transform:translateX(-50%);background:var(--gg);color:#1a1400;padding:10px 18px;border-radius:12px;font-weight:700;z-index:9;max-width:90%}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.tabs{overflow-x:auto;scrollbar-width:none;align-items:stretch}.tabs::-webkit-scrollbar{display:none}
.tabs button{position:relative;flex:1 0 auto;min-width:58px;padding:7px 2px 5px;line-height:1.2;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button span{font-size:17px}.tabs small{display:block;font-size:9.5px;font-weight:600;white-space:nowrap}
.bd{position:absolute;top:2px;right:4px;background:var(--bad);color:#fff;border-radius:10px;font-size:9px;min-width:14px;line-height:14px;padding:0 4px;font-style:normal}.bd:empty{display:none}
.rw{display:flex;gap:8px}.ch{margin:4px 0 6px;display:flex;gap:6px;flex-wrap:wrap}h3{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.15em;margin:18px 0 4px}
.gr{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:4px}.gr .c:hover{transform:none}
.th{width:84px;height:84px;object-fit:cover;border-radius:10px;border:1px solid var(--line);margin:6px 6px 0 0;cursor:pointer}.fl{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:10px;padding:6px 10px;margin:6px 6px 0 0}
input[type=file]{font-size:12px;padding:8px}.ov{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:20;padding:12px;overflow:auto}
.hd2{display:flex;align-items:center;gap:10px;margin-bottom:8px}.hd2 b{font-size:16px}
.av{flex:none;width:40px;height:40px;border-radius:50%;background:var(--gg);color:#0F1015;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center}
.av.avb{width:36px;height:36px;font-size:14px}
.crow{display:flex;align-items:center;gap:10px;margin:8px 0}
.crowb{flex:1;min-width:0}.crowb b{display:block;font-size:14px}.crowb p{margin:1px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.bdg2{flex:none;background:var(--gg);color:#0F1015;font-weight:700;font-size:11px;min-width:20px;height:20px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 6px}
.tmini{flex:none;color:var(--mut);font-size:10.5px}
.mg{max-width:82%;background:var(--card2);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:8px 12px;margin:6px 0;white-space:pre-wrap;word-break:break-word}.mg.me{margin-left:auto;background:rgba(212,175,55,.16);border-radius:14px 14px 4px 14px}.mg small{display:block;font-size:10px;color:var(--mut);text-align:right}
#list{padding-bottom:4px;min-height:40vh;display:flex;flex-direction:column}
.estate{margin:auto;text-align:center;padding:30px 10px;opacity:.85}
.estate .eic{font-size:44px;line-height:1;margin-bottom:14px;filter:grayscale(.15) opacity(.9)}
.estate b{display:block;font-size:15px;color:var(--tx);margin-bottom:4px}
.estate p{margin:0;font-size:12.5px}
body.has-cmp{padding-bottom:calc(env(safe-area-inset-bottom) + 160px)}
.cmp{display:flex;gap:6px;align-items:center;position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 64px);background:rgba(15,16,21,.97);backdrop-filter:blur(12px);padding:8px 10px;border-top:1px solid var(--line);z-index:4;max-width:780px;margin:0 auto}
.cmp input{margin:0}

async function impo(){const fl=$('#imf').files[0];if(!fl)return;try{const o=JSON.parse(await fl.text());for(const c in o)for(const i in o[c])await db.doc(c+'/'+i).set(o[c][i]);toast(t('saved'))}catch(e){toast(t('bad'))}}
draw();
function cfgMissing(){return!FIREBASE_CONFIG.apiKey||FIREBASE_CONFIG.apiKey=='XXXX'||FIREBASE_CONFIG.projectId=='XXXX'}
(async()=>{
 if(cfgMissing()){mode='cfgerr';return draw()}
 if(typeof firebase=='undefined'){mode='cfgerr';cfgErrMsg='Le SDK Firebase ne s’est pas chargé. Vérifiez que l’appareil a une connexion Internet active, puis réessayez. Si le problème persiste en testant dans Claude, ouvrez le fichier directement dans un navigateur (Chrome) hors de Claude.';return draw()}
 try{
  firebase.initializeApp(FIREBASE_CONFIG);
  const to=ms=>new Promise((_,rej)=>setTimeout(()=>rej({code:'timeout',message:'La connexion a pris trop de temps (plus de 12 secondes).'}),ms));
  await Promise.race([firebase.auth().signInAnonymously(),to(12000)]);
  db=firebase.firestore();
  fbReady=true;
 }catch(e){mode='cfgerr';const c=(e&&e.code)||'';
  cfgErrMsg=c=='timeout'?'La connexion à Firebase a pris trop de temps (12s). Vérifiez votre connexion Internet (Wi-Fi/données mobiles) et réessayez.':c=='auth/admin-restricted-operation'||c=='auth/operation-not-allowed'?'La connexion "Anonyme" n’est pas activée dans Firebase. Allez dans Authentication > Sign-in method > activez "Anonymous".':c?('Erreur Firebase ('+c+') : '+(e.message||'')):(e&&e.message)||String(e);
  return draw()}
 try{
  const ad=await db.doc('admin/creds').get();
  if(!ad.exists){adminMissing=true;canSetup=true}
 }catch(e){const c=(e&&e.code)||'';
  mode='cfgerr';
  cfgErrMsg=c=='permission-denied'?'Accès refusé par Firestore (permission-denied). Les règles de sécurité ("Rules") n’ont pas été publiées. Allez dans Firestore Database > Rules, collez le contenu de RULES_firestore.txt, puis cliquez Publier.':c?('Erreur Firestore ('+c+') : '+(e.message||'')):((e&&e.message)||String(e));
  return draw()}
 try{
  const ss=JSON.parse(st.kbs||'null');
  if(ss){
   if(ss.id=='admin'){const a2=await db.doc('admin/creds').get();if(a2.exists)return login({id:'admin',name:'Karim Benallouch'},1)}
   else{const d=await db.doc('accounts/'+ss.id).get();if(d.exists)return login({id:ss.id,...d.data()},0)}
  }
 }catch(e){}
 mode='auth';draw()})();
</script></body></html>
